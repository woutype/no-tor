<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No-Tor | Send </title>
    <link rel="stylesheet" href="/static/base.css">
    <link rel="stylesheet" href="/static/sender.css">
</head>
<body>
    <div class="content">



        <!-- Card select -->
        <div class="hidden" id="card-select">
            <div class="active" hidden>
                <div class="active-circle"></div>
                <span class="active-text">ACTIVE</span>
            </div>
            <div class="card">
                <input type="file" class="hidden" id="input-file">
                <label for="input-file" class="label-input">
                    <img src="/static/icons/upload.svg" alt="Upload" class="upload-icon">
                    <span class="label-text">Click here and select the file or folder</span>
                </label>
                <button type="button" class="start-btn">
                    <img src="/static/icons/energy.svg" alt="Start" class="energy">
                    <span class="start-sharing">START SHARING</span>
                </button>
            </div>
        </div>



        <!-- Card Share -->
        <div class="content" id="card-share">
            <div class="active">
                <div class="active-circle"></div>
                <span class="active-text">ACTIVE</span>
            </div>
            <div class="card">
                <div class="link-copy">
                    <span class="link-text">HTTPS Link (for browser)</span>
                    <div class="field-box">
                        <input type="text" class="field-input" id="web" readonly value="http://127.0.0.1:8080/download/{{ token }}"> 
                        <button type="button" class="field-copy-btn" id="web-btn">
                            <img src="/static/icons/copy.svg" alt="Copy" class="copy-icon" id="web-icon">
                            <span class="copy-text" id="web-text">Copy</span>
                        </button>
                    </div>
                </div>

                <div class="link-copy">
                    <span class="link-text">Terminal Link (for PowerShell / Terminal)</span>
                    <div class="field-box">
                        <input type="text" class="field-input" id="terminal" readonly value='curl -C - -O -L "http://127.0.0.1:8080/dl/{{ token }}/{{ file_name }}"'> 
                        <button type="button" class="field-copy-btn" id="terminal-btn">
                            <img src="/static/icons/copy.svg" alt="Copy" class="copy-icon" id="terminal-icon">
                            <span class="copy-text" id="terminal-text">Copy</span>
                        </button>
                    </div>
                </div>

                <button type="button" class="stop-btn">
                    <img src="/static/icons/stop.svg" alt="Stop" class="stop-icon">
                    <span class="stop-text">STOP SHARING</span>
                </button>
        </div>
    </div>

    <script src="/static/sender.js"></script>
</body>
</html>
